rules:
  - id: python-no-eval
    patterns:
      - pattern: eval(...)
    message: "Avoid using eval() as it can execute arbitrary Python code."
    languages: [python]
    severity: ERROR

  - id: python-no-exec
    patterns:
      - pattern: exec(...)
    message: "Avoid using exec() as it can execute arbitrary Python code."
    languages: [python]
    severity: ERROR

  - id: python-no-shell-true
    patterns:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
    message: "Avoid subprocess calls with shell=True due to command injection risks."
    languages: [python]
    severity: ERROR

  - id: python-banned-variable-names
    patterns:
      - pattern-either:
          - pattern: $VAR = $EXPR
          - pattern: "def $FUNC(..., $VAR, ...): ..."
          - pattern: "async def $FUNC(..., $VAR, ...): ..."
      - metavariable-regex:
          metavariable: $VAR
          regex: ^(temp|tmp|foo|bar|baz|dummy)$
    message: "Generic or AI-generated variable name '$VAR' rejected. Use domain-specific descriptive names."
    languages: [python]
    severity: ERROR

