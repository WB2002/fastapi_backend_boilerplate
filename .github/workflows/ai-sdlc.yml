name: AI-SDLC

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-sdlc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guardrail-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Notice guardrail changes
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          echo "Guardrail paths in this pull request:"
          git diff --name-only "$base"...HEAD | grep -E '(^|/)\.cursor/hooks\.json$|(^|/)\.cursor/hooks/|(^|/)\.cursor/BUGBOT\.md$|(^|/)\.cursorignore$|(^|/)scripts/verify[^/]*\.sh$|(^|/)scripts/ratchet\.sh$|(^|/)quality/|(^|/)\.github/|(^|/)CODEOWNERS$' || echo "(none)"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Full verification (no integration on CI)
        env:
          SKIP_INTEGRATION: '1'
        run: scripts/verify-full.sh

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Docs check
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: scripts/check-docs.sh

  pr-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Pull request size
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          set -euo pipefail
          if jq -e '.pull_request.labels[]? | select(.name=="large-change-approved")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "large-change-approved present"
            exit 0
          fi
          base=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
          if [ -z "$base" ]; then
            echo "PR base SHA missing"
            exit 1
          fi
          lines=$(git diff --numstat "$base"...HEAD | awk '{s+=$1+$2} END {print s+0}')
          echo "changed lines: $lines"
          if [ "$lines" -gt 400 ]; then
            echo "PR exceeds 400 changed lines (add large-change-approved label to override)"
            exit 1
          fi

  agent-evals:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run eval scaffold
        run: evals/run.sh
