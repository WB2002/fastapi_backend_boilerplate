repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: mypy-strict
        name: mypy strict
        entry: uv run mypy --strict app tests
        language: system
        pass_filenames: false
      - id: semgrep-guardrails
        name: semgrep guardrails (banned variable names & security)
        entry: ./scripts/ci/run-semgrep.sh
        language: system
        types: [python]
        pass_filenames: false
      - id: gitleaks-pre-commit
        name: gitleaks pre-commit
        entry: ./scripts/gitleaks-pre-commit.sh
        language: system
        pass_filenames: false
