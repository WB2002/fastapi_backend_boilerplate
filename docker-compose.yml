# On the same network, refer to a service by its service name (e.g. mongo, redis, app, worker) in connection strings.
services:
  app:
    container_name: app
    build:
      context: .
      target: api
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
      - MONGO_URI=mongodb://mongo:27017/nestjs-boilerplate
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-boilerplate}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - BACKGROUND_JOBS_ENABLED=true
    env_file:
      - .env
    depends_on:
      - mongo
      - redis
    networks:
      - backend-network

  worker:
    container_name: worker
    build:
      context: .
      target: worker
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-boilerplate}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - BACKGROUND_JOBS_ENABLED=true
      - BACKGROUND_WORKER_ENABLED=true
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - backend-network

  mongo:
    container_name: mongo
    image: mongo:8.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - backend-network

  # postgres:
  #   image: postgres:17
  #   ports:
  #     - "${POSTGRES_PORT:-5432}:5432"
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #     POSTGRES_DB: ${POSTGRES_DB:-boilerplate}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - backend-network

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend-network

  clamav:
    image: clamav/clamav:1.4
    container_name: clamav
    volumes:
      - clamav_data:/var/lib/clamav
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 3310 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s

networks:
  backend-network:
    driver: bridge

volumes:
  mongo_data:
  # postgres_data:
  redis_data:
  clamav_data:
